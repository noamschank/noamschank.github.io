name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      zenodo:
        description: "Zenodo: real (default) or sandbox (practice, nothing permanent)"
        default: real
        type: choice
        options: [real, sandbox]

permissions:
  contents: write   # to save DOIs back into the notes
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: pip install requests pyyaml
      - name: DOIs for notes marked zenodo:true
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_SANDBOX_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
        run: |
          if [ "${{ inputs.zenodo }}" = "sandbox" ]; then python zenodo.py --sandbox; else python zenodo.py; fi
      - name: Save DOIs
        run: |
          git config user.name "site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notes
          git diff --cached --quiet || (git commit -m "Add DOI" && git push)
      - run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
