project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*/*.qmd"
    # Hidden until there is content. To show them again, delete the two
    # lines below and the two "#" in front of the navbar entries.
    - "!notes/"
    - "!stellungnahmen.qmd"
  resources:
    - materialien/
    - CNAME

website:
  title: "Noam Schank"
  site-url: "https://noamschank.com"
  draft-mode: gone
  description: "Staatsrecht, Rechtstheorie und juristische Methodenlehre."
  navbar:
    collapse-below: lg
    left:
      - href: index.qmd
        text: Über mich
      - href: cv.qmd
        text: Lebenslauf
      - href: publications.qmd
        text: Publikationen
      - href: teaching.qmd
        text: Lehre
      # - href: notes/index.qmd
      #   text: Notizen
      # - href: stellungnahmen.qmd
      #   text: Stellungnahmen
    right:
      - href: index.qmd
        text: DE
      - href: fr/index.qmd
        text: FR
      - href: en/index.qmd
        text: EN
  page-footer:
    center: "© 2026 Noam Schank"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [cosmo, styles-dark.scss]
    toc: false
    lang: de
    include-after-body: lang.html
